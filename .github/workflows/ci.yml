name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build, test and check coverage
        run: mvn -B verify

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the app and database
        env:
          DB_PASSWORD: ci-only
        run: docker compose up -d --build --wait db
      - name: Start the web server
        env:
          DB_PASSWORD: ci-only
        run: docker compose up -d --build smarttour
      - name: Check the running site
        run: |
          for attempt in $(seq 1 60); do
            curl -sf http://localhost:8080/health && break
            sleep 2
          done
          curl -sf http://localhost:8080/api/v1/hubs | grep -q rajshahi
          curl -sf http://localhost:8080/district/rajshahi | grep -q Rajshahi
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
