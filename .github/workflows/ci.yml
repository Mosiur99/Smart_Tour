name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build, test and check coverage
        run: mvn -B verify

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Check the generated API types are current
        run: |
          npm run api:types
          git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: smarttour
          POSTGRES_USER: smarttour
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smarttour"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/smarttour
      DB_USERNAME: smarttour
      DB_PASSWORD: ci-only
      PGPASSWORD: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start the API
        run: |
          mvn -B -q package -DskipTests
          # A local admin user stands in for Cloudflare Access, which CI doesn't have.
          nohup java -jar target/smart-tour-planner-*.war --smarttour.catalog.version-check-interval=1s \
            --smarttour.admin.local-user=e2e@example.com --smarttour.admin.publishers=e2e@example.com \
            --smarttour.web.refresh-url=http://localhost:3917/hooks/catalog-changed \
            --smarttour.web.refresh-secret=e2e-only-refresh-secret > api.log 2>&1 &
          for attempt in $(seq 1 60); do curl -sf http://localhost:8081/health && break; sleep 2; done
          curl -sf http://localhost:8081/health
      - name: Load the fake test data
        run: psql -h localhost -U smarttour -d smarttour -v ON_ERROR_STOP=1 -f web/e2e/test-data.sql
      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Run the journeys on a phone screen
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Check Lighthouse scores and the script budget
        working-directory: web
        run: |
          npx --yes @lhci/cli@0.15.1 autorun || {
            # Show each failed check on the run page, not only in the log.
            node -e '
              const results = require("./.lighthouseci/assertion-results.json");
              for (const r of results.filter((r) => !r.passed)) {
                console.log(`::error title=Lighthouse ${r.level}::${r.url} ${r.auditProperty ? r.auditId + "." + r.auditProperty : r.auditId}: found ${r.actual}, needs ${r.operator} ${r.expected}`);
              }'
            exit 1
          }
      - name: Keep reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            web/playwright-report
            web/.lighthouseci
            api.log

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the history for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on high severity vulnerabilities
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the app and database
        env:
          DB_PASSWORD: ci-only
        run: docker compose up -d --build --wait db
      - name: Start the web server
        env:
          DB_PASSWORD: ci-only
        run: docker compose up -d --build smarttour
      - name: Check the running site
        run: |
          for attempt in $(seq 1 60); do
            curl -sf http://localhost:8080/health && break
            sleep 2
          done
          curl -sf http://localhost:8080/api/v1/hubs | grep -q rajshahi
          curl -sf http://localhost:8080/district/rajshahi | grep -q Rajshahi
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
