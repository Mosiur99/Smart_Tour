name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build, test and check coverage
        run: mvn -B verify

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Check the generated API types are current
        run: |
          npm run api:types
          git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the history for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on high severity vulnerabilities
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the app and database
        env:
          DB_PASSWORD: ci-only
        run: docker compose up -d --build --wait db
      - name: Start the web server
        env:
          DB_PASSWORD: ci-only
        run: docker compose up -d --build smarttour
      - name: Check the running site
        run: |
          for attempt in $(seq 1 60); do
            curl -sf http://localhost:8080/health && break
            sleep 2
          done
          curl -sf http://localhost:8080/api/v1/hubs | grep -q rajshahi
          curl -sf http://localhost:8080/district/rajshahi | grep -q Rajshahi
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
