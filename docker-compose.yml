services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: smarttour
      POSTGRES_USER: smarttour
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarttour"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  smarttour:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://db:5432/smarttour
      DB_USERNAME: smarttour
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    restart: unless-stopped

volumes:
  db-data:
