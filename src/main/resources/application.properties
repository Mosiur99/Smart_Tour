spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
server.port=8081
spring.application.name=SmartTour
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/smarttour}
